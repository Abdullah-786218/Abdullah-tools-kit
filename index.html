<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah - Project</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* ----- Loader Screen ----- */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .logo-loader-container {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Green and Blue Spinner Ring */
        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid transparent;
            border-top: 5px solid #00ffcc; /* Green/Cyan */
            border-right: 5px solid #0066ff; /* Blue */
            border-bottom: 5px solid #00ffcc;
            animation: spin 1.2s linear infinite;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* ----- Main Content ----- */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .header-name {
            font-weight: bold;
            font-size: 1.8rem;
            margin-top: 25px;
            text-align: center;
            width: 100%;
            letter-spacing: 1px;
        }

        .main-text {
            font-style: italic;
            font-weight: bold;
            font-size: 2.8rem;
            margin: 25px 0;
            text-align: center;
        }

        .section-box {
            border: 2px solid #ffffff;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            width: 80%;
            max-width: 600px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .box-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .content-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .content-item {
            margin: 10px 0;
            font-size: 1.2rem;
        }

        .content-item a {
            color: #00d2ff;
            text-decoration: none;
        }

        .content-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Loading Animation Screen -->
    <div id="loader-wrapper">
        <div class="logo-loader-container">
            <div class="spinner-ring"></div>
            <!-- Place your image file in the same folder and rename it to logo.png -->
            <img src="logo.png" alt="Abdullah Logo" class="logo-img">
        </div>
    </div>

    <!-- Main Website Content -->
    <div id="main-content">
        <div class="header-name">Abdullah</div>

        <div class="main-text">
            Welcome to My Project
        </div>

        <!-- Apps Section -->
        <div class="section-box" id="apps-box">
            <div class="box-title">Apps</div>
            <ul class="content-list">
                <li class="content-item">App 1 (Placeholder)</li>
                <li class="content-item">App 2 (Placeholder)</li>
            </ul>
        </div>

        <!-- Links Section -->
        <div class="section-box" id="links-box">
            <div class="box-title">Links</div>
            <ul class="content-list">
                <li class="content-item"><a href="#">Link 1</a></li>
                <li class="content-item"><a href="#">Link 2</a></li>
            </ul>
        </div>

        <!-- Groups Section -->
        <div class="section-box" id="groups-box">
            <div class="box-title">Groups</div>
            <ul class="content-list">
                <li class="content-item">Group 1 (Placeholder)</li>
                <li class="content-item">Group 2 (Placeholder)</li>
            </ul>
        </div>
    </div>

    <script>
        // Shows the main content after 2.5 seconds of loading animation
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader-wrapper');
                const mainContent = document.getElementById('main-content');
                
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    mainContent.style.display = 'flex';
                }, 500);
            }, 2500);
        });
    </script>
</body>
</html>
